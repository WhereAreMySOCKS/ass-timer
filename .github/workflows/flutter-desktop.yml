name: Flutter desktop

on:
  pull_request:
    paths:
      - "flutter_client/**"
      - ".github/workflows/flutter-desktop.yml"
  push:
    branches: [main]
    paths:
      - "flutter_client/**"
      - ".github/workflows/flutter-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 DMG
            os: macos-14
            artifact: macos-release
            path: flutter_client/releases/Ass-Timer.dmg*
          - name: Windows x64 ZIP
            os: windows-latest
            artifact: windows-release
            path: flutter_client/releases/Ass-Timer-Windows-x64.zip*
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flutter_client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install CocoaPods
        if: runner.os == 'macOS'
        run: brew install cocoapods

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: ./tool/build_macos_release.sh

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tool\build_windows_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly-$(date +%Y%m%d)"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly Build $(date +%Y-%m-%d)" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --prerelease \
            release-assets/*

  deploy:
    name: Publish installers to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.ASS_TIMER_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ASS_TIMER_DEPLOY_USER }}
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Install deployment SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ASS_TIMER_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ASS_TIMER_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?ASS_TIMER_DEPLOY_HOST is not configured}"
          : "${DEPLOY_USER:?ASS_TIMER_DEPLOY_USER is not configured}"
          : "${DEPLOY_SSH_KEY:?ASS_TIMER_DEPLOY_SSH_KEY is not configured}"
          : "${DEPLOY_KNOWN_HOSTS:?ASS_TIMER_DEPLOY_KNOWN_HOSTS is not configured}"
          ssh_dir="$RUNNER_TEMP/ass-timer-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"

      - name: Upload and atomically publish installers
        env:
          SSH_KEY: ${{ runner.temp }}/ass-timer-ssh/id_ed25519
          KNOWN_HOSTS: ${{ runner.temp }}/ass-timer-ssh/known_hosts
        run: |
          set -euo pipefail
          ssh_options=(-i "$SSH_KEY" -o IdentitiesOnly=yes -o UserKnownHostsFile="$KNOWN_HOSTS")
          release_dir="/home/ass-timer/backend/data/releases"
          incoming_dir="$release_dir/.incoming-${GITHUB_SHA}"
          remote="$DEPLOY_USER@$DEPLOY_HOST"

          ssh "${ssh_options[@]}" "$remote" \
            "set -eu; mkdir -p '$incoming_dir'; find '$incoming_dir' -mindepth 1 -maxdepth 1 -type f -delete"
          scp "${ssh_options[@]}" \
            release-assets/Ass-Timer.dmg \
            release-assets/Ass-Timer.dmg.sha256 \
            release-assets/Ass-Timer-Windows-x64.zip \
            release-assets/Ass-Timer-Windows-x64.zip.sha256 \
            "$remote:$incoming_dir/"

          ssh "${ssh_options[@]}" "$remote" \
            "set -eu; cd '$incoming_dir'; \
            test \"\$(awk '{print \$1}' Ass-Timer.dmg.sha256)\" = \"\$(sha256sum Ass-Timer.dmg | awk '{print \$1}')\"; \
            test \"\$(awk '{print \$1}' Ass-Timer-Windows-x64.zip.sha256)\" = \"\$(sha256sum Ass-Timer-Windows-x64.zip | awk '{print \$1}')\"; \
            install -m 0644 Ass-Timer.dmg '$release_dir/.Ass-Timer.dmg.new'; \
            install -m 0644 Ass-Timer.dmg.sha256 '$release_dir/.Ass-Timer.dmg.sha256.new'; \
            install -m 0644 Ass-Timer-Windows-x64.zip '$release_dir/.Ass-Timer-Windows-x64.zip.new'; \
            install -m 0644 Ass-Timer-Windows-x64.zip.sha256 '$release_dir/.Ass-Timer-Windows-x64.zip.sha256.new'; \
            mv -f '$release_dir/.Ass-Timer.dmg.new' '$release_dir/Ass-Timer.dmg'; \
            mv -f '$release_dir/.Ass-Timer.dmg.sha256.new' '$release_dir/Ass-Timer.dmg.sha256'; \
            mv -f '$release_dir/.Ass-Timer-Windows-x64.zip.new' '$release_dir/Ass-Timer-Windows-x64.zip'; \
            mv -f '$release_dir/.Ass-Timer-Windows-x64.zip.sha256.new' '$release_dir/Ass-Timer-Windows-x64.zip.sha256'; \
            find '$incoming_dir' -mindepth 1 -maxdepth 1 -type f -delete; rmdir '$incoming_dir'"
